spring:
  application:
    name: streaming-api

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aztcast:
  streaming:
    storage:
      # Regenerable caches. Siblings under var/ so one ignore rule, one Docker
      # volume and one `du` target cover both.
      downloads-dir: ./var/downloads
      hls-dir: ./var/hls

    ffmpeg:
      binary: ffmpeg
      probe-binary: ffprobe
      # Any H.264 encoder. Distros shipping a patent-free ffmpeg have libopenh264
      # instead of libx264; both yield Main@3.1, matching the advertised CODECS.
      video-codec: libx264
      timeout: 30m
      segment-duration: 4s
      renditions:
        - name: 720p
          width: 1280
          height: 720
          video-bitrate-kbps: 3000
          audio-bitrate-kbps: 128
        - name: 240p
          width: 426
          height: 240
          video-bitrate-kbps: 800
          audio-bitrate-kbps: 128

    torrent:
      video-extensions: [mp4, mkv, avi, mov, m4v, webm]
      download-timeout: 2h
      progress-log-interval: 5s

    transcoding:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500
        thread-name-prefix: "transcode-"

    web:
      # Empty in production: nginx makes the player and the API same-origin.
      allowed-origins: []

logging:
  level:
    # WARN, not ERROR: ERROR hid bt's swarm and tracker warnings, which are
    # exactly the diagnostics you need when a magnet stalls.
    bt: WARN
    lbms: WARN
