spring:
  application:
    name: streaming-api

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aztcast:
  streaming:
    storage:
      # Regenerable caches. Siblings under var/ so one ignore rule, one Docker
      # volume and one `du` target cover both.
      downloads-dir: ./var/downloads
      hls-dir: ./var/hls
      # Matches redis.job-ttl. Media outliving its job leaves directories nothing
      # can name; a job outliving its media reports READY for a video that is gone.
      retention: 7d

    ffmpeg:
      binary: ffmpeg
      probe-binary: ffprobe
      # Any H.264 encoder. Distros shipping a patent-free ffmpeg have libopenh264
      # instead of libx264; both yield Main@3.1, matching the advertised CODECS.
      video-codec: libx264
      timeout: 30m
      segment-duration: 4s
      # Rungs are spaced ~1.6-1.8x apart so there is a usable step for roughly every
      # doubling of bandwidth; too-close rungs cost encoding time and buy no adaptation.
      # Order matters only for readability — the player picks by BANDWIDTH.
      renditions:
        - name: 1080p
          width: 1920
          height: 1080
          video-bitrate-kbps: 5000
          audio-bitrate-kbps: 128
        - name: 720p
          width: 1280
          height: 720
          video-bitrate-kbps: 3000
          audio-bitrate-kbps: 128
        - name: 480p
          width: 854
          height: 480
          video-bitrate-kbps: 1500
          audio-bitrate-kbps: 96
        - name: 360p
          width: 640
          height: 360
          video-bitrate-kbps: 900
          audio-bitrate-kbps: 96
        - name: 240p
          width: 426
          height: 240
          video-bitrate-kbps: 500
          audio-bitrate-kbps: 64

    torrent:
      video-extensions: [mp4, mkv, avi, mov, m4v, webm]
      download-timeout: 2h
      progress-log-interval: 5s

      # Only fetch the file that will actually be transcoded. This pipeline picks the
      # largest video in the torrent and ignores the rest, so a season pack used to
      # spend nine tenths of its bandwidth on episodes nobody would ever be served.
      download-video-only: true

      # Announce URLs added to every magnet, on top of whatever it carries. Plenty of
      # magnets arrive with no &tr= at all and leave DHT to find the swarm alone, which
      # is slow to start and worse on a thin torrent.
      #
      # A snapshot, deliberately, not a live fetch: asking a remote list for trackers at
      # ingestion time would send a request timed to what is about to be downloaded, and
      # ADR-0016 already refuses that trade elsewhere. Refresh it by hand from
      # https://github.com/ngosang/trackerslist (trackers_best.txt) — see docs/runbook.md.
      #
      # All UDP: bt-core registers a UDP tracker factory (BEP-15), so these do announce
      # despite only the HTTP tracker client appearing in pom.xml.
      extra-trackers:
        - udp://tracker.opentrackr.org:1337/announce
        - udp://open.demonii.com:1337/announce
        - udp://open.stealth.si:80/announce
        - udp://exodus.desync.com:6969/announce
        - udp://explodie.org:6969/announce
        - udp://tracker.dler.org:6969/announce
        - udp://tracker.qu.ax:6969/announce
        - udp://tracker.therarbg.to:6969/announce
        - udp://tracker.farted.net:6969/announce
        - udp://zer0day.ch:1337/announce

      # How the client presents itself to the swarm. None of this is anonymity:
      # BitTorrent announces to the tracker and dials every peer directly, and the
      # library has no proxy support to bolt on. Hiding the origin address is the
      # network's job (a tunnel, a namespace) — see acceptor-address.
      network:
        # PREFER_ENCRYPTED, not REQUIRE_: obfuscation beats naive traffic
        # classification, but requiring it drops peers that will not do it.
        encryption: PREFER_ENCRYPTED
        # Multicast announces tell the whole LAN what this host is downloading,
        # and only find peers on that LAN. Off.
        disable-local-service-discovery: true
        # Left on: PEX is how a swarm stays healthy without leaning on trackers,
        # and it hides nothing from peers who are already in the swarm with us.
        disable-peer-exchange: false
        # Blank binds to whatever the library picks. Set it to a tunnel's address
        # to keep torrent traffic off every other interface — it binds outgoing
        # connections too, not just the listening socket.
        acceptor-address: ""
        acceptor-port: 6891
        # A ceiling on established connections, which is not the same as a ceiling on
        # transfer. Stays at 200 because each connection costs a 1 MiB network buffer.
        max-peer-connections-per-torrent: 200
        # This is the one that governs speed. The library defaults it to 10: only that
        # many connections are ever assigned pieces, so the 200 above bought peers that
        # sat idle. Raising it costs no memory, because those buffers already exist.
        max-active-peer-connections-per-torrent: 60
        # Global, across every torrent. One runtime is shared by all downloads, so this
        # is what concurrent ingestions compete for; above the per-torrent ceiling so
        # the second one does not starve.
        max-peer-connections: 600
        # How many connections may be opening at once. Governs how fast the swarm fills,
        # not how large it gets.
        max-pending-connection-requests: 200
        peers-per-tracker-request: 200
        # Unbounded in the library, which lets a slow disk back up in heap with nothing
        # to stop it. At 16 KiB a block this caps that backlog around 32 MiB.
        max-io-queue-size: 2048

    # Who served each torrent. Off by default: it records peer addresses, which are
    # personal data, and that should be a choice rather than a side effect of upgrading.
    providers:
      enabled: false
      database-path: ./var/providers.db
      # Point these at a City and an ASN .mmdb to record where peers are and whose
      # network they are on. MaxMind GeoLite2 needs a free account and a licence key;
      # DB-IP Lite and IP2Location LITE publish compatible files that need neither.
      # Blank means peers are still logged, just without location.
      geoip-city-database: ""
      geoip-asn-database: ""
      retention: 30d
      queue-capacity: 10000

    transcoding:
      pool:
        # One ffmpeg process encodes the whole ladder at once, so a single job uses far
        # more CPU and out-of-heap memory than the old one-rung-at-a-time loop did.
        # max-size is concurrent *videos*; it came down from 4 when the ladder went from
        # two sequential rungs to five parallel ones. Raise it and the container memory
        # limit together — docs/runbook.md records the exit-137 this causes.
        #
        # core-size equals max-size deliberately. ThreadPoolTaskExecutor only grows past
        # core-size once the queue is *full*, so core-size: 1 with a 500-deep queue meant
        # the second thread would have appeared on the 501st video and never before: two
        # concurrent transcodes were configured and one was what ran.
        core-size: 2
        max-size: 2
        queue-capacity: 500
        thread-name-prefix: "transcode-"

    playback:
      # Off by default so `mvn spring-boot:run` serves bytes itself with no nginx
      # in front. The docker profile turns it on, because that is the only
      # topology where the internal location and the media volume both exist.
      offload-enabled: false
      # Must match the `internal` location in deploy/nginx/default.conf.
      internal-prefix: /_media

    redis:
      # Off by default: the service starts and works with no Redis anywhere. Without it,
      # job state is per-instance and lost on restart (as it always was), duplicate
      # ingestions are not detected, and ingestion is not rate limited.
      # Playback is unaffected either way — serving a segment never touches Redis.
      enabled: false
      # Should not outlive the media itself, or a job reports READY for a video that has
      # already been deleted.
      job-ttl: 7d
      rate-limit:
        # Small burst, modest sustained rate: one ingestion is hours of CPU and gigabytes
        # of disk, so the useful limit is far lower than for an ordinary write endpoint.
        capacity: 5
        refill-per-hour: 20

    web:
      # Empty in production: nginx makes the player and the API same-origin.
      allowed-origins: []

logging:
  level:
    # WARN, not ERROR: ERROR hid bt's swarm and tracker warnings, which are
    # exactly the diagnostics you need when a magnet stalls.
    bt: WARN
    lbms: WARN
