spring:
  application:
    name: streaming-api

server:
  port: 8080
  shutdown: graceful
  # Loopback, deliberately. This runs on the machine of the person using it, and the
  # only thing here that has any business facing the internet is the BitTorrent port --
  # peers cannot reach you otherwise. The HTTP API has the opposite need: nobody outside
  # this host should be able to reach an interface that downloads torrents on request.
  #
  # Set to 0.0.0.0 to serve the LAN, and add whatever address you reach it on to
  # aztcast.streaming.web.allowed-hosts, or the Host check below will refuse it.
  # The docker profile already does both -- see application-docker.yml.
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aztcast:
  streaming:
    storage:
      # Siblings under var/ so one ignore rule, one Docker volume and one `du`
      # target cover both. Only the first of the two is regenerable.
      downloads-dir: ./var/downloads
      hls-dir: ./var/hls
      # The HLS ladder is never deleted automatically. It is what you asked for, it
      # sits on your disk, and it goes when you delete it -- see ADR-0030.
      #
      # This governs the raw torrent under downloads/ only, and only the copies that
      # were abandoned. A download whose transcode succeeded is discarded the moment
      # that transcode is verified, so this is a backstop for a failed fetch or a
      # crashed encode rather than the path most downloads take.
      download-retention: 24h
      # Refuse to start an ingestion with less than this free on the downloads
      # volume. Nothing reclaims space on its own now, so the alternative to
      # refusing up front is filling the disk and failing halfway through. 0 is off.
      min-free-space: 2GB

    ffmpeg:
      binary: ffmpeg
      probe-binary: ffprobe

      # `auto` asks the binary what it carries and takes the first preference it has.
      # Naming an encoder here pins the service to one build: libx264 is absent from
      # every patent-free distribution, and the previous answer to that was a profile
      # saying "actually libopenh264 here", which covers only the machines someone
      # remembered to write a profile for. Both yield H.264 Main, and the CODECS the
      # master advertises is measured off the output either way.
      video-codec: auto
      video-codec-preference: [libx264, libopenh264, h264_v4l2m2m]

      # `auto` means veryfast on encoders whose presets are x264's, and nothing at all
      # on encoders that have no -preset. Emitted only when the resolved encoder
      # actually defines the option.
      preset: auto

      timeout: 30m
      segment-duration: 4s

      # One audio rendition, shared by every rung via an EXT-X-MEDIA group. The ladder
      # used to encode this same track once per rung: five AAC encodes and five copies
      # of the same audio in the segments, ~90 MB of duplication on a 22-minute episode.
      audio:
        # libfdk_aac beats the native encoder at these bitrates and plenty of builds
        # carry it. Plenty do not, which is why this is a list.
        encoder-preference: [libfdk_aac, aac]

        # `source` keeps the layout the file arrived with. Folding a 5.1 track to stereo
        # threw away four channels for no gain in reach: Chrome reports six-channel AAC
        # as `supported` and `smooth` (navigator.mediaCapabilities), and hands the
        # downmix to the viewer's own output device, which knows their speakers and we
        # do not. Set a number here to force a downmix anyway.
        channels: source

        # `source` too. Forcing 48 kHz put every 44.1 kHz source through a resampler to
        # arrive nowhere better.
        sample-rate: source

        # Per channel, so one setting is right for every layout: 128k in stereo, 384k at
        # 5.1 — which is what Apple's authoring specification asks for. A fixed number
        # cannot be both.
        bitrate-kbps-per-channel: 64
        max-bitrate-kbps: 512

        # What to do when this build cannot turn the source audio into AAC. E-AC-3 is
        # the audio of essentially every AMZN WEB-DL and a patent-free ffmpeg has no
        # decoder for it, so this is an ordinary case, not an exotic one.
        #
        #   passthrough  copy the track in untouched when fMP4 can carry it (it can
        #                carry ac3/eac3/aac/flac/alac/opus). Plays on Apple's platforms;
        #                everywhere else the player takes the video-only variants this
        #                service also advertises and the video runs silent.
        #   drop         produce a video-only ladder. Honest, universal, silent.
        #   fail         refuse the ingestion, in milliseconds, with a message naming
        #                the missing decoder.
        #
        # All three are workarounds for a missing decoder. The fix is a build that has
        # one — scripts/check-prereqs.sh names the package for this distribution.
        on-undecodable: passthrough

      # Text subtitle tracks in the source, republished as WebVTT sidecars and
      # advertised as an EXT-X-MEDIA subtitle group. Bitmap tracks (PGS, VobSub) need
      # OCR rather than a muxer and are skipped.
      subtitles:
        enabled: true

      # Detection only for now: what the host could offer is reported on
      # /actuator/health and by scripts/check-prereqs.sh, and the encode stays in
      # software. An encoder appearing in `ffmpeg -encoders` is not the same as one
      # that opens — h264_vaapi is listed on hosts whose Mesa driver exposes no H.264
      # profile at all — so the probe is a real one-frame encode.
      hardware:
        enabled: true
        device: /dev/dri/renderD128

      # Rungs are spaced ~1.6-1.8x apart so there is a usable step for roughly every
      # doubling of bandwidth; too-close rungs cost encoding time and buy no adaptation.
      # Order matters only for readability — the player picks by BANDWIDTH.
      #
      # Video only: audio is one shared rendition, configured above. What each rung
      # actually costs is weighed off its segments once written, so BANDWIDTH is
      # measured rather than derived from these numbers.
      renditions:
        - name: 1080p
          width: 1920
          height: 1080
          video-bitrate-kbps: 5000
        - name: 720p
          width: 1280
          height: 720
          video-bitrate-kbps: 3000
        - name: 480p
          width: 854
          height: 480
          video-bitrate-kbps: 1500
        - name: 360p
          width: 640
          height: 360
          video-bitrate-kbps: 900
        - name: 240p
          width: 426
          height: 240
          video-bitrate-kbps: 500

    torrent:
      video-extensions: [mp4, mkv, avi, mov, m4v, webm]
      download-timeout: 2h
      progress-log-interval: 5s

      # Only fetch the file that will actually be transcoded. This pipeline picks the
      # largest video in the torrent and ignores the rest, so a season pack used to
      # spend nine tenths of its bandwidth on episodes nobody would ever be served.
      download-video-only: true

      # Where the BitTorrent client runs.
      #
      #   embedded  the bt library inside this JVM. Every byte from a stranger is parsed in the
      #             process that also holds your media root, your job store and your provider
      #             database. It is the default because it needs nothing installed.
      #   brokered  a separate sandboxed process over a Unix socket, which can write to the
      #             downloads directory and do nothing else. It is what the compose stack runs,
      #             because that is where the sandbox can actually be applied. See ADR-0032.
      engine: embedded
      engine-socket: /run/aztcast/engine.sock

      # Announce URLs added to every magnet, on top of whatever it carries. Plenty of
      # magnets arrive with no &tr= at all and leave DHT to find the swarm alone, which
      # is slow to start and worse on a thin torrent.
      #
      # A snapshot, deliberately, not a live fetch: asking a remote list for trackers at
      # ingestion time would send a request timed to what is about to be downloaded, and
      # ADR-0016 already refuses that trade elsewhere. Refresh it by hand from
      # https://github.com/ngosang/trackerslist (trackers_best.txt) — see docs/runbook.md.
      #
      # All UDP: bt-core registers a UDP tracker factory (BEP-15), so these do announce
      # despite only the HTTP tracker client appearing in pom.xml.
      extra-trackers:
        - udp://tracker.opentrackr.org:1337/announce
        - udp://open.demonii.com:1337/announce
        - udp://open.stealth.si:80/announce
        - udp://exodus.desync.com:6969/announce
        - udp://explodie.org:6969/announce
        - udp://tracker.dler.org:6969/announce
        - udp://tracker.qu.ax:6969/announce
        - udp://tracker.therarbg.to:6969/announce
        - udp://tracker.farted.net:6969/announce
        - udp://zer0day.ch:1337/announce
        - udp://tracker.publictracker.xyz:6969/announce
        - udp://tracker.peerfect.org:6969/announce
        - udp://tracker.auctor.tv:6969/announce
        - udp://tracker-udp.gbitt.info:80/announce

      # Announce hosts stripped out of a magnet before it is used. The additions above only help;
      # these are the ones that actively cost. A public magnet is copied between indexers for years
      # and keeps trackers that shut down long ago — every one of these appeared in a single real
      # magnet this pipeline was handed, and every one of them cost a full tracker timeout on every
      # announce round, ahead of the live trackers queued behind them.
      #
      # Matched on host, so a port or path change does not resurrect one.
      dead-trackers:
        - public.popcorn-tracker.org
        - tracker.coppersurfer.tk
        - torrent.gresille.org
        - tracker.internetwarriors.net
        - glotorrents.pw
        - p4p.arenabg.com
        - tracker.bittor.pw
        - open.facedatabase.com
        - tracker.pirateparty.gr
        - tracker.zer0day.to

      network:
        # PREFER_ENCRYPTED, not REQUIRE_: obfuscation beats naive traffic
        # classification, but requiring it drops peers that will not do it.
        encryption: PREFER_ENCRYPTED
        # Multicast announces tell the whole LAN what this host is downloading,
        # and only find peers on that LAN. Off.
        disable-local-service-discovery: true
        # Left on: PEX is how a swarm stays healthy without leaning on trackers,
        # and it hides nothing from peers who are already in the swarm with us.
        disable-peer-exchange: false
        # Blank means "the address this host's default route actually goes out on",
        # resolved at startup. The library's own answer is the first non-loopback IPv4
        # address the JVM enumerates, which on any machine with Docker installed is a
        # container bridge — this one enumerates sixteen of them ahead of the physical
        # NIC, so every run bound to 172.20.0.1 and no peer on the internet could reach
        # the listening socket.
        #
        # Set it to a tunnel's address to keep torrent traffic off every other
        # interface; it binds outgoing connections too, not just the listening socket.
        acceptor-address: ""
        acceptor-port: 6891
        # A ceiling on established connections, which is not the same as a ceiling on
        # transfer. Stays at 200 because each connection costs a 1 MiB network buffer.
        max-peer-connections-per-torrent: 200
        # This is the one that governs speed. The library defaults it to 10: only that
        # many connections are ever assigned pieces, so the 200 above bought peers that
        # sat idle. Raising it costs no memory, because those buffers already exist.
        max-active-peer-connections-per-torrent: 60
        # Global, across every torrent. One runtime is shared by all downloads, so this
        # is what concurrent ingestions compete for; above the per-torrent ceiling so
        # the second one does not starve.
        max-peer-connections: 600
        # How many connections may be opening at once. Governs how fast the swarm fills,
        # not how large it gets.
        max-pending-connection-requests: 200
        peers-per-tracker-request: 200
        # Unbounded in the library, which lets a slow disk back up in heap with nothing
        # to stop it. At 16 KiB a block this caps that backlog around 32 MiB.
        max-io-queue-size: 2048

        # How long to wait for a tracker to answer. The library leaves this unset, which means a
        # dead host is only abandoned when the socket itself gives up — the TimeoutException from
        # bt.peer.ScheduledPeerSource in the logs is that happening ten seconds at a time, serially,
        # while live trackers wait behind it.
        tracker-timeout: 8s

    # Who served each torrent. Off by default: it records peer addresses, which are
    # personal data, and that should be a choice rather than a side effect of upgrading.
    providers:
      enabled: false
      database-path: ./var/providers.db
      # Point these at a City and an ASN .mmdb to record where peers are and whose
      # network they are on. MaxMind GeoLite2 needs a free account and a licence key;
      # DB-IP Lite and IP2Location LITE publish compatible files that need neither.
      # Blank means peers are still logged, just without location.
      geoip-city-database: ""
      geoip-asn-database: ""
      retention: 30d
      queue-capacity: 10000

    transcoding:
      pool:
        # One ffmpeg process encodes the whole ladder at once, so a single job uses far
        # more CPU and out-of-heap memory than the old one-rung-at-a-time loop did.
        # max-size is concurrent *videos*; it came down from 4 when the ladder went from
        # two sequential rungs to five parallel ones. Raise it and the container memory
        # limit together — docs/runbook.md records the exit-137 this causes.
        #
        # core-size equals max-size deliberately. ThreadPoolTaskExecutor only grows past
        # core-size once the queue is *full*, so core-size: 1 with a 500-deep queue meant
        # the second thread would have appeared on the 501st video and never before: two
        # concurrent transcodes were configured and one was what ran.
        core-size: 2
        max-size: 2
        queue-capacity: 500
        thread-name-prefix: "transcode-"

    playback:
      # Off by default so `mvn spring-boot:run` serves bytes itself with no nginx
      # in front. The docker profile turns it on, because that is the only
      # topology where the internal location and the media volume both exist.
      offload-enabled: false
      # Must match the `internal` location in deploy/nginx/default.conf.
      internal-prefix: /_media

    redis:
      # Off by default: the service starts and works with no Redis anywhere. Without it,
      # job state is per-instance and lost on restart (as it always was), duplicate
      # ingestions are not detected, and ingestion is not rate limited.
      # Playback is unaffected either way — serving a segment never touches Redis.
      enabled: false
      # How long a finished job stays queryable. Not paired with anything on the storage
      # side any more: media does not expire, and deleting a video deletes its job record
      # with it, so this only bounds how long a progress record nobody is polling lingers.
      job-ttl: 7d
      rate-limit:
        # Small burst, modest sustained rate: one ingestion is hours of CPU and gigabytes
        # of disk, so the useful limit is far lower than for an ordinary write endpoint.
        capacity: 5
        refill-per-hour: 20

    web:
      # Empty in production: nginx makes the player and the API same-origin.
      allowed-origins: []
      # Host header allowlist. Binding to loopback is not the boundary it looks like:
      # a page you visit can rebind its own DNS name to 127.0.0.1 once the browser has
      # cached the origin, and then talk to this API as same-origin. Checking Host is
      # the server-side half that stops it -- the attacker controls the name, not the
      # value we agreed to answer to. Same class of bug as Transmission's RPC.
      #
      # Add the hostname you actually reach this on if it is not one of these. Empty
      # disables the check, the same way an empty allowed-origins disables CORS.
      allowed-hosts: [localhost, 127.0.0.1, "::1", "[::1]"]

logging:
  level:
    # WARN, not ERROR: ERROR hid bt's swarm and tracker warnings, which are
    # exactly the diagnostics you need when a magnet stalls.
    bt: WARN
    lbms: WARN
