# Container: media lives on a named volume, and nginx fronts both services so
# every request the browser makes is same-origin.
spring:
  data:
    redis:
      host: redis
      port: 6379
      # Fail fast. A slow Redis must not become a slow API: these bound how long a request
      # thread can be held hostage by an unhealthy cache.
      timeout: 250ms
      connect-timeout: 500ms

server:
  # Behind nginx, getRemoteAddr() returns the nginx container's address, so without this
  # every client shares one rate-limit bucket and the per-IP limit is silently a global one.
  forward-headers-strategy: framework
  # All interfaces, overriding the loopback default -- and this is not a weakening. The
  # container's own network namespace is the boundary here: 8080 is never published to the
  # host (see deploy/docker-compose.yml), so the only thing that can reach it is nginx on
  # the compose network. Binding loopback inside the container would hide the API from
  # nginx and break the stack, not harden it.
  address: 0.0.0.0

aztcast:
  streaming:
    storage:
      downloads-dir: /var/lib/aztcast/downloads
      hls-dir: /var/lib/aztcast/hls
      download-retention: 24h
      min-free-space: 2GB
    playback:
      # nginx is in front, the media volume is mounted read-only into it, and
      # /_media is declared internal there. Segment bytes leave via sendfile and
      # never touch a Tomcat thread.
      offload-enabled: true
      internal-prefix: /_media
    redis:
      enabled: true

    torrent:
      # Brokered here, and only here. The sandbox this buys -- own user, own network, no
      # capabilities, one writable directory -- is a container thing, so this is the profile
      # where it can actually be applied. See ADR-0032 and the torrent-engine service in
      # deploy/docker-compose.yml.
      engine: brokered
      engine-socket: /run/aztcast/engine.sock
      network:
        # Stricter in a container than on a laptop, because the container is the thing
        # that gets pointed at a tunnel. None of it is anonymity — see the header of
        # docker-compose.vpn.yml, which is where the address actually gets hidden.
        #
        # REQUIRE_ENCRYPTED, not PREFER_: a plaintext fallback is a peer-by-peer decision
        # made by the other end, so "prefer" means an observer only has to be talking to
        # us to opt out of it. It costs peers that will not do MSE.
        encryption: REQUIRE_ENCRYPTED
        # Multicast announces to a Docker bridge find nothing and tell the host network
        # what is being downloaded. No reason to send them.
        disable-local-service-discovery: true
        # Also off here, unlike the default. PEX trades peer lists with everyone connected,
        # which broadcasts the swarm's membership — including this node's participation in
        # it — further than the trackers already do. It costs peers; behind a tunnel that
        # is the trade worth making.
        disable-peer-exchange: true

    # Recording peer addresses is off by default here too. Turn it on deliberately, and
    # read the retention note in the README before you do.
    providers:
      database-path: /var/lib/aztcast/providers.db

    web:
      allowed-origins: []
      # The browser reaches nginx on localhost:8000 and nginx forwards Host unchanged, so
      # the value arriving here is whatever was typed in the address bar. Add the name you
      # use if it is not one of these -- a LAN address or a hostname will be refused
      # otherwise, which is the check working rather than a misconfiguration.
      allowed-hosts: [localhost, 127.0.0.1, "::1", "[::1]"]
