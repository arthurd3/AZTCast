# Developer laptop: Vite dev server on 5173 talking to this process on 8080.
aztcast:
  streaming:
    web:
      allowed-origins:
        - http://localhost:5173

    # Fedora and other patent-free ffmpeg builds ship libopenh264, not libx264.
    # Check yours with: ffmpeg -encoders | grep 264
    ffmpeg:
      video-codec: libopenh264

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.azt.streaming: DEBUG
