name: backend-ci

on:
  push:
    branches: [main]
    paths: ['streaming-api/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['streaming-api/**', '.github/workflows/backend-ci.yml']

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: streaming-api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs the unit tests, the @WebMvcTest slices and the ArchUnit
      # fitness functions, so a broken slice boundary fails the build here.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: streaming-api/target/surefire-reports/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # Builds only — publishing is out of scope until a registry is chosen.
      # This still catches the failure mode that matters: an image whose base
      # lacks ffmpeg, or a broken layered-jar entrypoint.
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: streaming-api/Dockerfile
          push: false
          load: true
          tags: aztcast/streaming-api:ci

      - name: Verify ffmpeg and the default encoder are present in the image
        run: |
          docker run --rm --entrypoint ffmpeg aztcast/streaming-api:ci -hide_banner -version
          docker run --rm --entrypoint sh aztcast/streaming-api:ci -c \
            'ffmpeg -hide_banner -encoders | grep -q "\blibx264\b"'
