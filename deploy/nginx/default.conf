# Serves the player and reverse-proxies the API onto the same origin.
#
# This file is the reason the API can ship with an empty CORS allowlist: the
# browser only ever talks to this server, so no request is cross-origin. The
# previous setup — Live Server on :5501, Spring on :8080 — is what forced
# allowedOriginPatterns("*").

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx's stock mime.types predates HLS; without these a statically served
    # playlist or segment would go out as application/octet-stream, which
    # browsers refuse to append to a media source.
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
        video/iso.segment             m4s;
        video/mp4                     mp4;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; HTML is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Multi-page, not an SPA: a missing path is a 404, not a rewrite to index.
    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://streaming-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Segments are large and transcoding is slow; do not buffer them in nginx.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /actuator/health {
        proxy_pass http://streaming-api:8080;
        proxy_set_header Host $host;
    }

    # API documentation. Exposed because this stack is unauthenticated anyway —
    # see the security note in README.md — so hiding the docs would buy nothing.
    # Drop these two blocks if the service is ever put behind auth and made public.
    location /v3/api-docs {
        proxy_pass http://streaming-api:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui {
        proxy_pass http://streaming-api:8080;
        proxy_set_header Host $host;
    }
}
