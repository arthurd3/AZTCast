# Serves the player and reverse-proxies the API onto the same origin.
#
# This file is the reason the API can ship with an empty CORS allowlist: the
# browser only ever talks to this server, so no request is cross-origin. The
# previous setup — Live Server on :5501, Spring on :8080 — is what forced
# allowedOriginPatterns("*").

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    # Stock mime.types on nginx 1.27 already knows m3u8, ts and mp4 — declaring them
    # again only produced three "duplicate extension" warnings on every start. m4s is
    # the one it still lacks, and serving a CMAF segment as application/octet-stream
    # is a documented cause of the bufferAppend failures in docs/troubleshooting-hls.md.
    types {
        video/iso.segment m4s;
    }

    gzip on;
    # Playlists are highly compressible text that a player re-fetches for the whole
    # session. Segments are not here on purpose: .m4s/.ts/.mp4 are already compressed,
    # so gzipping them burns CPU to add bytes.
    gzip_types text/css application/javascript application/json image/svg+xml
               application/vnd.apple.mpegurl;
    gzip_min_length 1024;
    # Default is `off`, which means nothing that came from a proxy_pass is ever
    # compressed — including every playlist the API serves.
    gzip_proxied any;

    # Hashed assets are immutable; HTML is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Multi-page, not an SPA: a missing path is a 404, not a rewrite to index.
    location / {
        try_files $uri $uri/ =404;
    }

    # Segment bytes leave the box from here, not from the JVM.
    #
    # The API answers /api/v1/stream/... with headers only and an X-Accel-Redirect
    # pointing into this location; nginx then writes the file with sendfile(). The
    # JVM does the authorisation and returns, instead of holding a worker thread for
    # the length of a transfer.
    #
    # There is deliberately no proxy_cache on the stream route: nginx does not cache
    # a response that carries X-Accel-Redirect (the internal redirect happens during
    # header processing, before the cache layer), so it would be a permanent silent
    # MISS. It would also be redundant — there is no remote origin here, the file on
    # disk is the cache, and open_file_cache is what makes re-serving it cheap.
    location /_media/ {
        internal;
        alias /var/lib/aztcast/hls/;

        sendfile on;
        tcp_nopush on;
        # Segments are large and read once; going through the page cache would evict
        # everything useful to serve bytes nobody re-reads from RAM anyway.
        aio threads;
        directio 4m;
        output_buffers 2 1m;

        # HLS means a great many small files. Caching descriptors and stat() results
        # is most of the win at high concurrency.
        open_file_cache max=10000 inactive=5m;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        # No Cache-Control here on purpose. The API sets it — it is the side that knows
        # whether a name is a segment or a playlist — and it was verified to survive the
        # internal redirect. Setting it here too emitted two Cache-Control headers on
        # every segment, which is exactly the kind of thing that works until a client
        # picks the other one.
        #
        # Makes the offload verifiable from the browser. Without it, a regression that
        # quietly routed bytes back through the JVM would look identical from outside.
        add_header X-Served-By "nginx-sendfile" always;
    }

    location /api/v1/stream/ {
        proxy_pass http://streaming-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter *appends* to whatever
        # the client sent, and Spring's ForwardedHeaderFilter reads the leftmost entry — so a
        # client could pick its own rate-limit bucket just by sending its own header.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The upstream response is headers only, so there is nothing to stream through.
        proxy_buffering on;
    }

    location /api/ {
        proxy_pass http://streaming-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter *appends* to whatever
        # the client sent, and Spring's ForwardedHeaderFilter reads the leftmost entry — so a
        # client could pick its own rate-limit bucket just by sending its own header.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Segments are large and transcoding is slow; do not buffer them in nginx.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /actuator/health {
        proxy_pass http://streaming-api:8080;
        proxy_set_header Host $host;
    }

    # API documentation. Exposed because this stack is unauthenticated anyway —
    # see the security note in README.md — so hiding the docs would buy nothing.
    # Drop these two blocks if the service is ever put behind auth and made public.
    location /v3/api-docs {
        proxy_pass http://streaming-api:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui {
        proxy_pass http://streaming-api:8080;
        proxy_set_header Host $host;
    }
}
