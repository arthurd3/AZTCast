<!DOCTYPE html>
<html>
<head>
    <title>Teste HLS.js Mínimo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background:#111;color:#eee;font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;">
    <div style="max-width:1100px;margin:20px auto;">
        <h2>Teste HLS.js com Diagnóstico</h2>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <input type="text" id="url" value="http://localhost:8080/api/v1/stream/610a68ed-3ced-44d8-a2f1-dbb40f7cb696/master.m3u8" style="width:650px;padding:8px;border-radius:6px;border:1px solid #444;background:#222;color:#eee;">
            <button onclick="playHLS()" style="padding:8px 14px;border:0;border-radius:6px;background:#2e7d32;color:#fff;cursor:pointer;">▶ Play</button>
            <button onclick="inspectUrl()" style="padding:8px 14px;border:0;border-radius:6px;background:#1976d2;color:#fff;cursor:pointer;">🔍 Inspecionar</button>
            <button onclick="clearLogs()" style="padding:8px 14px;border:0;border-radius:6px;background:#616161;color:#fff;cursor:pointer;">🗑 Limpar</button>
        </div>
        <div style="margin:18px 0;">
            <video id="video" controls width="100%" style="max-width:1000px;background:#000;border-radius:8px;" crossorigin="anonymous"></video>
        </div>

        <div id="status" style="margin:10px 0;padding:10px;border-radius:6px;background:#222;border:1px solid #333;color:#ddd;"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;">
            <div>
                <h3 style="margin:8px 0 6px;">Logs</h3>
                <div id="log" style="height:300px;overflow:auto;padding:10px;border-radius:6px;background:#1a1a1a;border:1px solid #333;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;line-height:1.4;"></div>
            </div>
            <div>
                <h3 style="margin:8px 0 6px;">Sugestões</h3>
                <div id="hints" style="min-height:300px;padding:10px;border-radius:6px;background:#1a1a1a;border:1px solid #333;font-size:13px;"></div>
            </div>
        </div>
    </div>

    <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const hintsEl = document.getElementById('hints');

    function addLog(msg, type = 'info') {
        const color = type === 'error' ? '#ff6b6b' : type === 'warn' ? '#ffd166' : '#9ccc65';
        const time = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.innerHTML = `<span style="color:#888;">[${time}]</span> <span style="color:${color}">${msg}</span>`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
        console[type === 'error' ? 'error' : type === 'warn' ? 'warn' : 'log'](msg);
    }

    function setStatus(msg, kind = 'info') {
        const bg = kind === 'error' ? '#3a1e20' : kind === 'success' ? '#1e3a29' : '#1f2a3a';
        const border = kind === 'error' ? '#6d2b31' : kind === 'success' ? '#2b6d4a' : '#2b3a6d';
        statusEl.style.background = bg; statusEl.style.borderColor = border;
        statusEl.textContent = msg;
    }

    function setHints(items) {
        hintsEl.innerHTML = items.map(t => `• ${t}`).join('<br>');
    }

    function clearLogs(){ logEl.innerHTML = ''; hintsEl.innerHTML = ''; statusEl.textContent = ''; }

    function safe(obj){
        try { return JSON.stringify(obj, (k,v)=> (v instanceof Error ? {message:v.message, stack:v.stack} : v), 2); } catch(e){ return String(obj); }
    }

    async function inspectUrl(){
        const url = document.getElementById('url').value;
        addLog(`Inspecionando manifest: ${url}`);
        try {
            const res = await fetch(url, { method: 'GET' });
            const ct = res.headers.get('content-type');
            const text = await res.text();
            addLog(`Manifest status=${res.status} content-type=${ct}`);
            const isMaster = /#EXT-X-STREAM-INF/i.test(text);
            if(isMaster){
                const codecs = [...text.matchAll(/CODECS\s*=\s*"([^"]+)"/gi)].map(m=>m[1]);
                addLog(`Master playlist detectada. CODECS encontrados: ${codecs.join(' | ') || 'nenhum'}`);
                codecs.forEach(c => {
                    const mime = `video/mp4; codecs="${c.split(',')[0]}"`;
                    addLog(`MSE suporta ${mime}? ${MediaSource.isTypeSupported(mime)}`);
                });
            } else {
                addLog('Media playlist detectada (sem #EXT-X-STREAM-INF).');
                const seg = (text.match(/^[^#].+/m) || [null])[0];
                if(seg){
                    const abs = new URL(seg, url).toString();
                    const head = await fetch(abs, { method: 'HEAD' });
                    addLog(`Primeiro segmento: ${abs} status=${head.status} type=${head.headers.get('content-type')}`);
                }
            }
            setStatus('Inspeção concluída. Verifique os CODECS e MIME acima.');
        } catch (e) {
            addLog('Falha ao inspecionar: ' + e.message, 'error');
            setStatus('Falha ao inspecionar URL.', 'error');
        }
    }

    function playHLS() {
        const video = document.getElementById('video');
        const url = document.getElementById('url').value;
        clearLogs();
        setStatus('Inicializando player...');

        if (Hls.isSupported()) {
            const hls = new Hls({
                debug: false,
                enableWorker: false,
                backBufferLength: 90,
            });

            // Eventos úteis de diagnóstico
            hls.on(Hls.Events.MEDIA_ATTACHED, () => addLog('MEDIA_ATTACHED'));
            hls.on(Hls.Events.MANIFEST_LOADED, (ev, data) => addLog(`MANIFEST_LOADED: levels=${data.levels?.length ?? 'n/a'} type=${data.type}`));
            hls.on(Hls.Events.MANIFEST_PARSED, (ev, data) => {
                const lvls = (data.levels||[]).map((l,i)=>`L${i}:${l.width||'?'}x${l.height||'?'} vc=${l.videoCodec||'?'} ac=${l.audioCodec||'?'} fps=${l.frameRate||'?'} `).join(' | ');
                addLog('Manifest carregado!');
                addLog('Levels: ' + lvls);
                setStatus('Manifest carregado. Iniciando reprodução...', 'success');
                video.play().catch(e=> addLog('Autoplay bloqueado: ' + e.message, 'warn'));
            });
            hls.on(Hls.Events.BUFFER_CREATED, (ev, data) => addLog('BUFFER_CREATED: ' + safe(data.tracks)));
            hls.on(Hls.Events.BUFFER_APPENDING, (ev, data) => addLog(`BUFFER_APPENDING: type=${data.type} start=${data.start?.toFixed?.(2)} end=${data.end?.toFixed?.(2)}`));
            hls.on(Hls.Events.BUFFER_APPENDED, (ev, data) => addLog(`BUFFER_APPENDED: type=${data.type}`));
            hls.on(Hls.Events.FRAG_PARSING_INIT_SEGMENT, (ev, data) => addLog(`INIT_SEGMENT: codecs=${safe(data.initSegment?.codec || data)} `));

            hls.on(Hls.Events.ERROR, function(event, data) {
                addLog(`ERRO: type=${data.type} details=${data.details} fatal=${data.fatal} error=${data.error?.message||''}`, data.fatal || data.type==='mediaError' ? 'error' : 'warn');

                if (data.details && /bufferAppend/i.test(data.details)) {
                    setHints([
                        'Possível codec/container não suportado pelo navegador. Prefira H.264 (avc1) + AAC (mp4a.40.2).',
                        'Confirme que o master.m3u8 tem CODECS compatíveis com o conteúdo real.',
                        'Verifique MIME no servidor: m3u8: application/vnd.apple.mpegurl; TS: video/mp2t; fMP4 .m4s: video/iso.segment; init.mp4: video/mp4.',
                        'Cheque com ffprobe se os segmentos estão em H.264/AAC e se os PTS são monotônicos.',
                        'Para fMP4, garanta segmentos curtos (2-6s) e init segment válido.'
                    ]);
                }

                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            setStatus('Erro de rede. Tentando recuperar...', 'error');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            setStatus('Erro de mídia. Tentando recuperar...', 'error');
                            hls.recoverMediaError();
                            break;
                        default:
                            setStatus('Erro fatal não recuperável. Veja os logs.', 'error');
                            hls.destroy();
                            break;
                    }
                }
            });

            hls.attachMedia(video);
            hls.loadSource(url);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            setStatus('Usando suporte nativo HLS (Safari)', 'success');
            video.src = url;
            video.addEventListener('loadedmetadata', function() { video.play(); });
        } else {
            setStatus('HLS não suportado neste navegador.', 'error');
        }
    }
    </script>
</body>
</html>
